# Inferno vGPU Guest Firmware & Prelink Package Specification
# Mirrors reims-vgpu's firmware/prebuilt & guest/prebuilt-arm64e/set.toml layout.

[package]
format = "IVGF"
version = 1
min_ios = "14.0"
target_soc = "t8030"
target_arch = "arm64e"
featureset_class = "MTL2,2"

[[entries]]
kind = "dt-overlay"
id = "dev.inferno.pvgpu.dt-overlay"
source = "dt-overlay.plist"
required = true

